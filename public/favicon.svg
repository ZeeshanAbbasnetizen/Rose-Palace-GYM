<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rosePalaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A16" />
      <stop offset="100%" stop-color="#FF5F05" />
    </linearGradient>
  </defs>
  <!-- Orange Circle Background -->
  <circle cx="256" cy="256" r="256" fill="url(#rosePalaceGrad)"/>
  
  <!-- Black Diagonal Dumbbell -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Central Bar -->
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0A0A0A"/>
    
    <!-- Left Inner Weight Plate -->
    <rect x="-76" y="-60" width="36" height="120" rx="18" fill="#0A0A0A"/>
    <!-- Left Outer Weight Plate -->
    <rect x="-120" y="-45" width="32" height="90" rx="16" fill="#0A0A0A"/>
    
    <!-- Right Inner Weight Plate -->
    <rect x="40" y="-60" width="36" height="120" rx="18" fill="#0A0A0A"/>
    <!-- Right Outer Weight Plate -->
    <rect x="88" y="-45" width="32" height="90" rx="16" fill="#0A0A0A"/>
  </g>
</svg>
